import React, { useState, useEffect, useMemo } from 'react';
import { Chess } from 'chess.js';
import { Chessboard } from 'react-chessboard';

// 共通のブロック型定義
export interface BlockData {
id: string;
type: 'accordion' | 'interactive-chess' | 'static-chess';
title?: string; // アコーディオンのタイトル等
content: string; // 本文、PGN、FENなどを格納する想定
}

export interface BlockProps {
block: BlockData;
updateBlock: (id: string, updates: Partial<BlockData>) => void;
}

// ==========================================
// 1. アコーディオンブロック (AccordionBlock)
// ==========================================
export const AccordionBlock: React.FC<BlockProps> = ({ block, updateBlock }) => {
return (
<details className="border border-gray-300 rounded-md p-4 mb-4 bg-white shadow-sm">
<summary
className="font-bold cursor-pointer outline-none list-none flex items-center"
// デフォルトの矢印を消してカスタムアイコンなどを付ける場合はここで調整
>
<span className="mr-2 text-gray-500">▶</span>
<input
type="text"
value={block.title || ''}
placeholder="タイトルを入力..."
onChange={(e) => updateBlock(block.id, { title: e.target.value })}
onClick={(e) => e.preventDefault()} // 入力時の開閉トグルを防ぐ
className="flex-1 border-none outline-none bg-transparent focus:ring-0"
/>
</summary>
<div className="mt-4 pl-6">
<textarea
value={block.content || ''}
placeholder="詳細な内容を入力してください..."
onChange={(e) => updateBlock(block.id, { content: e.target.value })}
className="w-full min-h-[100px] border border-gray-200 rounded p-2 outline-none resize-y focus:border-blue-400"
/>
</div>
</details>
);
};

// ==========================================
// 2. インタラクティブチェスボード (InteractiveChessBlock)
// ==========================================
export const InteractiveChessBlock: React.FC<BlockProps> = ({ block, updateBlock }) => {
const [currentMoveIndex, setCurrentMoveIndex] = useState<number>(-1);

// ユーザーが入力したPGNを元に、現在の局面のFENと棋譜リストを計算
const { currentFen, moveHistory } = useMemo(() => {
const game = new Chess();
try {
if (block.content) {
game.loadPgn(block.content);
}
} catch (e) {
// PGNのパースエラー時は無視して初期盤面にするなどのフォールバック
console.warn("Invalid PGN", e);
}
const history = game.history({ verbose: true });

// 指定された手番(currentMoveIndex)まで進めた盤面を生成
const playGame = new Chess();
for (let i = 0; i <= currentMoveIndex && i < history.length; i++) {
playGame.move(history[i]);
}

return {
currentFen: playGame.fen(),
moveHistory: history
};
}, [block.content, currentMoveIndex]);

// PGNが更新されたら最新の手に合わせる
useEffect(() => {
setCurrentMoveIndex(moveHistory.length - 1);
}, [block.content, moveHistory.length]);

return (
<div className="border border-gray-300 rounded-md p-4 mb-4 bg-white shadow-sm flex flex-col md:flex-row gap-4">
{/* 左側: チェスボードとコントロール */}
<div className="w-full md:w-1/2 flex flex-col items-center">
<div className="w-full max-w-[400px]">
<Chessboard
id={`interactive-board-${block.id}`}
position={currentFen}
arePiecesDraggable={false} // 閲覧モード想定のためFalse（操作可能にする場合はonPieceDropを実装）
customArrows={[]} // 拡張用: PGNデータに基づいて矢印を描画する土台
customSquareStyles={{}} // 拡張用: 特定のマスをハイライトする土台
/>
</div>
<div className="flex gap-4 mt-4">
<button
onClick={() => setCurrentMoveIndex(prev => Math.max(-1, prev - 1))}
className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded font-bold"
disabled={currentMoveIndex < 0}
>
＜ 戻る
</button>
<button
onClick={() => setCurrentMoveIndex(prev => Math.min(moveHistory.length - 1, prev + 1))}
className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded font-bold"
disabled={currentMoveIndex >= moveHistory.length - 1}
>
進む ＞
</button>
</div>
</div>

{/* 右側: PGN入力と棋譜リスト */}
<div className="w-full md:w-1/2 flex flex-col gap-2">
<textarea
value={block.content || ''}
placeholder="PGNを入力してください (例: 1. e4 e5...)"
onChange={(e) => updateBlock(block.id, { content: e.target.value })}
className="w-full min-h-[100px] border border-gray-200 rounded p-2 outline-none focus:border-blue-400 text-sm font-mono"
/>

{/* 棋譜リスト (クリックでその局面にジャンプ) */}
<div className="mt-2 bg-gray-50 p-2 rounded h-[200px] overflow-y-auto flex flex-wrap gap-1 content-start">
{moveHistory.map((move, i) => (
<React.Fragment key={i}>
{i % 2 === 0 && <span className="font-bold text-gray-500 ml-1">{Math.floor(i / 2) + 1}.</span>}
<button
onClick={() => setCurrentMoveIndex(i)}
className={`px-1 rounded hover:bg-blue-100 ${currentMoveIndex === i ? 'bg-blue-200 font-bold' : ''}`}
>
{move.san}
</button>
</React.Fragment>
))}
</div>
</div>
</div>
);
};

// ==========================================
// 3. 静的チェスボード (StaticChessBlock)
// ==========================================
export const StaticChessBlock: React.FC<BlockProps> = ({ block, updateBlock }) => {
// FEN文字列が空の場合は初期配置にするフォールバック
const fenPosition = block.content || 'start';

// 拡張性: propsからハイライト情報等を受け取る想定ですが、
// 今回はコンポーネント内で定義する形にしています。必要に応じてPropsの型を拡張してください。
const customArrows = [];
const customSquareStyles = {};

return (
<div className="border border-gray-300 rounded-md p-4 mb-4 bg-white shadow-sm flex flex-col md:flex-row gap-4 items-center">
<div className="w-full md:w-1/2 max-w-[400px]">
<Chessboard
id={`static-board-${block.id}`}
position={fenPosition}
arePiecesDraggable={false} // 操作不可設定
customArrows={customArrows}
customSquareStyles={customSquareStyles}
/>
</div>
<div className="w-full md:w-1/2 w-full">
<label className="block text-sm font-bold text-gray-700 mb-1">FEN文字列</label>
<textarea
value={block.content || ''}
placeholder="FENを入力してください..."
onChange={(e) => updateBlock(block.id, { content: e.target.value })}
className="w-full min-h-[80px] border border-gray-200 rounded p-2 outline-none focus:border-blue-400 text-sm font-mono"
/>
</div>
</div>
);
};